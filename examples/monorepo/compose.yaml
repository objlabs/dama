x-app: &app
  environment:
    DAMA_ENVIRONMENT: ${DAMA_ENVIRONMENT:-dev}
    DAMA_BASE_PATH: ""
  restart: unless-stopped

services:
  typescript-api:
    <<: *app
    build:
      context: .
      dockerfile: apps/typescript-api/Dockerfile
    ports:
      - "127.0.0.1:${TYPESCRIPT_API_PORT:-4001}:3000"
  rust-api:
    <<: *app
    build:
      context: .
      dockerfile: apps/rust-api/Dockerfile
    ports:
      - "127.0.0.1:${RUST_API_PORT:-4002}:8080"
  python-api:
    <<: *app
    build:
      context: .
      dockerfile: apps/python-api/Dockerfile
    ports:
      - "127.0.0.1:${PYTHON_API_PORT:-4003}:8000"
