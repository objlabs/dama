services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: dama-admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_admin
    secrets: [minio_admin]
    volumes:
      - minio-data:/data
    networks: [database]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ ! -s /data/users.acl ]; then
          cp /run/secrets/redis_acl /data/users.acl
          chown redis:redis /data/users.acl
          chmod 0600 /data/users.acl
        fi
        exec docker-entrypoint.sh redis-server --appendonly yes --aclfile /data/users.acl
    secrets: [redis_acl]
    volumes:
      - redis-data:/data
    networks: [database]
    restart: unless-stopped
volumes:
  minio-data:
  redis-data:
secrets:
  minio_admin:
    file: ${DAMA_MINIO_PASSWORD_FILE:?Set the environment-specific MinIO password file}
  redis_acl:
    file: ${DAMA_REDIS_ACL_FILE:?Set the environment-specific Redis ACL file}
